<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 3 -Inheritance</title>
  </head>
  <body>
    <!-- Task 3: 
    Create a web page that:
    1.Defines an object animal with a method makeSound() that returns "Some sound".
    2.Defines another object dog with a property name: "Buddy".
    3.Uses __ proto __
    4.Logs the output of dog.makeSound() to the console to inherit makeSound() from animal into dog. -->
    <h2>Object Inheritance</h2>
    <script>
      // Creating the animal object
      let animal = {
        makeSound: function () {
          return "Some sound";
        },
      };
      // Creating the dog object
      let dog = {
        name: "Buddy",
      };
      // Inheriting properties and methods from animal
      dog.__proto__ = animal;
      // Calling the inherited method
      console.log(dog.makeSound());
    </script>
  </body>
</html>
