<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Changing Font Size</title>
  </head>
  <body>
    <!-- Task 1:
     Create a web page that does the following:
     1.Displays a heading that says: "Watch me grow!"
     2.Includes an input box where the user can enter a number (e.g., 20, 50, 100).
     3.Has a button labeled "Change Font Size".
     4.When the button is clicked, the heading's font size should change according to the number entered by the user (in pixels). -->
    <h4 id="heading">Watch me grow!</h4>
    <input
      type="number"
      id="fontSize"
      placeholder="Enter the font size"
    /><br /><br />
    <button onclick="changeSize()">Change Font Size</button>
    <script>
      function changeSize() {
        let size = document.getElementById("fontSize").value;
        document.getElementById("heading").style.fontSize = size + "px";
      }
    </script>
  </body>
</html>
